# /etc/asound.conf — configurazione ALSA per Vintage Tel BL
# Scheda audio I2S (PCM5102A DAC + INMP441 ADC esposti come HiFiBerry)
#
# Il volume di cornetta (ascolto e microfono) passa per due controlli softvol
# pilotabili con amixer / dall'app (vedi audio.py):
#   - PhoneSoftVol     → livello altoparlante cornetta (toni + audio chiamata BT)
#   - PhoneCaptureVol  → guadagno microfono cornetta

pcm.!default {
    type asym
    playback.pcm "speaker_vol"
    capture.pcm "mic_vol"
}

# ─── Altoparlante: hardware + softvol ────────────────────────────────
pcm.speaker {
    type plug
    slave.pcm "hw:CARD=sndrpihifiberry,DEV=0"
}

pcm.speaker_vol {
    type softvol
    slave.pcm "speaker"
    control {
        name "PhoneSoftVol"
        card sndrpihifiberry
    }
    min_dB -50.0
    max_dB 0.0
    resolution 256
}

# ─── Microfono: hardware + softvol (consente boost del mic) ──────────
pcm.mic {
    type plug
    slave {
        pcm "hw:CARD=sndrpihifiberry,DEV=0"
        channels 1
        rate 16000
    }
}

pcm.mic_vol {
    type softvol
    slave.pcm "mic"
    control {
        name "PhoneCaptureVol"
        card sndrpihifiberry
    }
    min_dB -20.0
    max_dB 30.0
    resolution 256
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# Filtro echo cancellation (caricato anche da PulseAudio)
pcm.aec {
    type plug
    slave.pcm "speaker_vol"
}
