# /etc/asound.conf — configurazione ALSA per Vintage Tel BL
# Scheda audio I2S (PCM5102A DAC + INMP441 ADC esposti come HiFiBerry)

pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}

pcm.speaker {
    type plug
    slave.pcm "hw:CARD=sndrpihifiberry,DEV=0"
}

pcm.mic {
    type plug
    slave {
        pcm "hw:CARD=sndrpihifiberry,DEV=0"
        channels 1
        rate 16000
    }
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# Filtro echo cancellation (caricato anche da PulseAudio)
pcm.aec {
    type plug
    slave.pcm "speaker"
}
