# Vintage Tel With Bluetooth Workflow Feature Implementation With Tests

## Action

Follow the feature-implementation-with-tests workflow:
1. Modify or add implementation files in firmware/src/
2. Create or update test files in firmware/tests/ to cover the new or changed functionality
3. Update configuration or example files if needed (e.g., config.example.yaml)
4. Commit both the implementation and tests together

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: firmware/src/*.py, firmware/tests/test_*.py

